<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-label="OWASP Top 10 2021 coverage">
  <defs>
    <linearGradient id="ow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#12111F"/>
    </linearGradient>
    <linearGradient id="ow-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#3DDC97"/>
    </linearGradient>
    <linearGradient id="ow-bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D5BD0"/>
      <stop offset="100%" stop-color="#9B8CFF"/>
    </linearGradient>
    <clipPath id="ow-frame"><rect width="1000" height="268" rx="12"/></clipPath>
  </defs>

  <style>
    .m  { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .hd { font-size: 12px; font-weight: 700; letter-spacing: 3px; fill: #6E7789; }
    .rk { font-size: 11px; font-weight: 700; fill: #9B8CFF; letter-spacing: .5px; }
    .nm { font-size: 13px; fill: #C7D0E0; }
    .lg { font-size: 10.5px; fill: #5D6779; letter-spacing: .6px; }

    .row { animation: fadein .6s ease-out both; }
    @keyframes fadein { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.15s}.r3{animation-delay:.25s}.r4{animation-delay:.35s}.r5{animation-delay:.45s}
    .r6{animation-delay:.55s}.r7{animation-delay:.65s}.r8{animation-delay:.75s}.r9{animation-delay:.85s}.r10{animation-delay:.95s}

    /* Sirayla dolasan tarama parlamasi */
    .glow { animation: sweep 10s ease-in-out infinite; opacity: 0; }
    @keyframes sweep { 0%,100% { opacity: 0; } 4%,7% { opacity: .16; } 11% { opacity: 0; } }
    .g1{animation-delay:0s}.g2{animation-delay:1s}.g3{animation-delay:2s}.g4{animation-delay:3s}.g5{animation-delay:4s}
    .g6{animation-delay:5s}.g7{animation-delay:6s}.g8{animation-delay:7s}.g9{animation-delay:8s}.g10{animation-delay:9s}

    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1; }
      .glow { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#ow-frame)">
    <rect width="1000" height="268" fill="url(#ow-bg)"/>

    <text class="m hd" x="34" y="34">OWASP TOP 10 — 2021 · WHERE I WORK</text>
    <text class="m lg" x="966" y="34" text-anchor="end">DEPTH OF FOCUS</text>
    <line x1="34" y1="48" x2="966" y2="48" stroke="#1E2635"/>

    <!-- Sol sutun -->
    <g class="row r1">
      <rect class="glow g1" x="26" y="62" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="34" y="82">A01</text>
      <text class="m nm" x="76" y="82">Broken Access Control</text>
      <rect x="330" y="76" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="330" y="76" height="4" rx="2" width="150" fill="url(#ow-bar)"><animate attributeName="width" from="0" to="150" dur="1.1s" begin="0.5s" fill="freeze"/></rect>
    </g>
    <g class="row r2">
      <rect class="glow g2" x="26" y="100" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="34" y="120">A02</text>
      <text class="m nm" x="76" y="120">Cryptographic Failures</text>
      <rect x="330" y="114" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="330" y="114" height="4" rx="2" width="92" fill="url(#ow-bar2)"><animate attributeName="width" from="0" to="92" dur="1.1s" begin="0.6s" fill="freeze"/></rect>
    </g>
    <g class="row r3">
      <rect class="glow g3" x="26" y="138" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="34" y="158">A03</text>
      <text class="m nm" x="76" y="158">Injection</text>
      <rect x="330" y="152" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="330" y="152" height="4" rx="2" width="143" fill="url(#ow-bar)"><animate attributeName="width" from="0" to="143" dur="1.1s" begin="0.7s" fill="freeze"/></rect>
    </g>
    <g class="row r4">
      <rect class="glow g4" x="26" y="176" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="34" y="196">A04</text>
      <text class="m nm" x="76" y="196">Insecure Design</text>
      <rect x="330" y="190" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="330" y="190" height="4" rx="2" width="104" fill="url(#ow-bar2)"><animate attributeName="width" from="0" to="104" dur="1.1s" begin="0.8s" fill="freeze"/></rect>
    </g>
    <g class="row r5">
      <rect class="glow g5" x="26" y="214" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="34" y="234">A05</text>
      <text class="m nm" x="76" y="234">Security Misconfiguration</text>
      <rect x="330" y="228" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="330" y="228" height="4" rx="2" width="132" fill="url(#ow-bar)"><animate attributeName="width" from="0" to="132" dur="1.1s" begin="0.9s" fill="freeze"/></rect>
    </g>

    <line x1="500" y1="62" x2="500" y2="244" stroke="#1A2130"/>

    <!-- Sag sutun -->
    <g class="row r6">
      <rect class="glow g6" x="514" y="62" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="522" y="82">A06</text>
      <text class="m nm" x="564" y="82">Vulnerable Components</text>
      <rect x="818" y="76" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="818" y="76" height="4" rx="2" width="118" fill="url(#ow-bar2)"><animate attributeName="width" from="0" to="118" dur="1.1s" begin="1.0s" fill="freeze"/></rect>
    </g>
    <g class="row r7">
      <rect class="glow g7" x="514" y="100" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="522" y="120">A07</text>
      <text class="m nm" x="564" y="120">Identification &amp; Auth Failures</text>
      <rect x="818" y="114" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="818" y="114" height="4" rx="2" width="140" fill="url(#ow-bar)"><animate attributeName="width" from="0" to="140" dur="1.1s" begin="1.1s" fill="freeze"/></rect>
    </g>
    <g class="row r8">
      <rect class="glow g8" x="514" y="138" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="522" y="158">A08</text>
      <text class="m nm" x="564" y="158">Software &amp; Data Integrity</text>
      <rect x="818" y="152" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="818" y="152" height="4" rx="2" width="112" fill="url(#ow-bar2)"><animate attributeName="width" from="0" to="112" dur="1.1s" begin="1.2s" fill="freeze"/></rect>
    </g>
    <g class="row r9">
      <rect class="glow g9" x="514" y="176" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="522" y="196">A09</text>
      <text class="m nm" x="564" y="196">Logging &amp; Monitoring Failures</text>
      <rect x="818" y="190" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="818" y="190" height="4" rx="2" width="86" fill="url(#ow-bar2)"><animate attributeName="width" from="0" to="86" dur="1.1s" begin="1.3s" fill="freeze"/></rect>
    </g>
    <g class="row r10">
      <rect class="glow g10" x="514" y="214" width="460" height="30" rx="6" fill="#9B8CFF"/>
      <text class="m rk" x="522" y="234">A10</text>
      <text class="m nm" x="564" y="234">Server-Side Request Forgery</text>
      <rect x="818" y="228" width="150" height="4" rx="2" fill="#1E2635"/>
      <rect x="818" y="228" height="4" rx="2" width="136" fill="url(#ow-bar)"><animate attributeName="width" from="0" to="136" dur="1.1s" begin="1.4s" fill="freeze"/></rect>
    </g>

    <rect x="0.5" y="0.5" width="999" height="267" rx="12" fill="none" stroke="#1E2635"/>
  </g>
</svg>
