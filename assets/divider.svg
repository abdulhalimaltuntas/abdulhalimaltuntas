<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9B8CFF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#9B8CFF" stop-opacity="0.75"/>
      <stop offset="50%"  stop-color="#6D5BD0" stop-opacity="0.55"/>
      <stop offset="82%"  stop-color="#3DDC97" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#CFC6FF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#CFC6FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CFC6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .travel { animation: travel 6s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes travel {
      0%   { transform: translateX(-140px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(1010px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .travel { animation: none; opacity: 0; } }
  </style>

  <rect x="0" y="5" width="1000" height="1.6" rx="0.8" fill="url(#dg)"/>
  <rect class="travel" x="0" y="4" width="130" height="3.5" rx="1.75" fill="url(#pulse)"/>
</svg>
