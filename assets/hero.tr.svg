<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" fill="none" role="img" aria-labelledby="title desc" xml:lang="tr">
  <title id="title">Abdulhalim Altuntaş — Web Uygulama Sızma Testi Uzmanı</title>
  <desc id="desc">Lacivert zemin üzerinde Abdulhalim Altuntaş’ın adı ve uzmanlık alanı; sağda web, API ve erişim noktalarını temsil eden soyut bir ağ diyagramı.</desc>
  <defs>
