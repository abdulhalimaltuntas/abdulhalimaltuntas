      <stop offset="0" stop-color="#0d1423"/>
      <stop offset="1" stop-color="#131b2d"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#9285ec" stop-opacity=".13"/>
      <stop offset="1" stop-color="#9285ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7a8ff"/>
      <stop offset="1" stop-color="#7fe0c3"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="300" rx="20"/></clipPath>
  </defs>
