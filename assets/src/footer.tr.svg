<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="192" viewBox="0 0 1000 192" role="img" aria-labelledby="title desc">
<title id="title">Güvenliğin bir sonraki adımını konuşalım</title><desc id="desc">Abdulhalim Altuntaş ile web güvenliği, araç geliştirme ve iş birliği hakkında iletişime geçin: altuntashalim123@gmail.com.</desc>
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60e7f9" stop-opacity=".65"/><stop offset=".43" stop-color="#a78bfa" stop-opacity=".12"/><stop offset="1" stop-color="#ff73b9" stop-opacity=".45"/></linearGradient>
 <linearGradient id="energy" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="280" y2="0"><stop stop-color="#60e7f9" stop-opacity="0"/><stop offset=".45" stop-color="#60e7f9"/><stop offset=".72" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9" stop-opacity="0"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#6f44b8" stop-opacity=".28"/><stop offset="1" stop-color="#6f44b8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8da5d5" stroke-width=".5" opacity=".08"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="998" height="190" rx="23"/></clipPath>
</defs>
<style>
@keyframes stage1 {0%,5%{opacity:0}10%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage2 {0%,19%{opacity:0}24%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage3 {0%,33%{opacity:0}38%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage4 {0%,47%{opacity:0}52%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage5 {0%,61%{opacity:0}66%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes pulse {0%,100%{opacity:.4}50%{opacity:1}}
@keyframes cursor {0%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes energy {0%{transform:translateX(-280px)}100%{transform:translateX(1100px)}}
@keyframes trace {to{stroke-dashoffset:-36}}
@media (prefers-reduced-motion: no-preference) {
 .s1{animation:stage1 12s linear infinite}.s2{animation:stage2 12s linear infinite}.s3{animation:stage3 12s linear infinite}.s4{animation:stage4 12s linear infinite}.s5{animation:stage5 12s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:cursor 1.1s steps(1) infinite}.energy{animation:energy 7s linear infinite}.trace{animation:trace 4s linear infinite}
}
@media (prefers-reduced-motion: reduce) {.s1,.s2,.s3,.s4,.s5,.pulse,.cursor{opacity:1}.energy{opacity:.7}}

</style>
<rect x=".5" y=".5" width="999" height="191" rx="23.5" fill="#070b14" stroke="url(#edge)"/>
<g clip-path="url(#frame)"><ellipse cx="960" cy="60" rx="430" ry="220" fill="url(#ambient)"/><rect width="1000" height="192" fill="url(#grid)"/><path d="M32 34h20" stroke="#60e7f9" stroke-width="2"/><text x="63" y="38" font-family="JetBrains Mono" font-size="10" font-weight="500" letter-spacing="1.5" fill="#60e7f9" text-anchor="start">BİRLİKTE ÜRETELİM</text><text x="30" y="92" font-family="Space Grotesk" font-size="40" font-weight="600" letter-spacing="-1.35" fill="#eef5ff" text-anchor="start">Güvenliği birlikte geliştirelim.</text><text x="32" y="124" font-family="Space Grotesk" font-size="14" font-weight="400" letter-spacing="0.05" fill="#8d9bb6" text-anchor="start">Web güvenliği / araç geliştirme / iş birliği</text><text x="32" y="158" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#7ef5bd" text-anchor="start">altuntashalim123@gmail.com</text><circle cx="894" cy="97" r="66" fill="none" stroke="#a78bfa" stroke-opacity=".1"/><circle class="pulse" cx="894" cy="97" r="55" fill="none" stroke="#a78bfa" stroke-opacity=".15"/><rect x="858" y="61" width="72" height="72" rx="22" fill="#60e7f9" fill-opacity=".08" stroke="#60e7f9" stroke-opacity=".55"/><path d="M881 110l26-26m-22 0h22v22" fill="none" stroke="#60e7f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 190H1000" stroke="#25334e" stroke-width="2"/><path class="energy" d="M0 190h280" stroke="url(#energy)" stroke-width="2.5"/></g>
</svg>