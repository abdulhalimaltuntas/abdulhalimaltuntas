<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="284" viewBox="0 0 1000 284" role="img" aria-labelledby="title desc">
<title id="title">A structured approach</title><desc id="desc">Define scope, map the attack surface, validate weaknesses, connect the findings, and report actionable remediation.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152a"/><stop offset="1" stop-color="#070b14"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141c32"/><stop offset="1" stop-color="#0c1222"/></linearGradient>
<linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="32" y1="1" x2="968" y2="1"><stop stop-color="#60e7f9"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5941b8" stop-opacity=".28"/><stop offset="1" stop-color="#5941b8" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7386bd" stroke-opacity=".045"/></pattern>
</defs>
<style>
.trace {stroke-dasharray:28 580; animation:travel 11s linear infinite;}
.trace-alt {stroke-dasharray:18 510; animation:travel 15s linear infinite reverse;}
.breathe {animation:breathe 5s ease-in-out infinite;}
@keyframes travel {to {stroke-dashoffset:-1216;}}
@keyframes breathe {0%,100% {opacity:.30;} 50% {opacity:.65;}}
@media (prefers-reduced-motion: reduce) { .trace,.trace-alt,.breathe {animation:none;} }
</style>
<rect x="1" y="1" width="998" height="282" rx="24" fill="url(#panel)" stroke="#26304a"/>
<rect x="2" y="2" width="996" height="280" rx="23" fill="url(#grid)"/>
<ellipse cx="830.0" cy="55" rx="350.0" ry="230" fill="url(#halo)"/>
<path d="M32 1H968" stroke="url(#spectrum)" stroke-width="2" opacity=".8"/>
<text x="32" y="46" font-family="JetBrains Mono" font-size="14" font-weight="500" letter-spacing="1.2" fill="#9faccc" text-anchor="start">THE METHODOLOGY</text><text x="32" y="89" font-family="Space Grotesk" font-size="31" font-weight="600" letter-spacing="0" fill="#eff4ff" text-anchor="start">A structured approach</text><text x="965" y="47" font-family="JetBrains Mono" font-size="11.5" font-weight="500" letter-spacing="0.8" fill="#b5a0f9" text-anchor="end">ANALYZE / VALIDATE / DELIVER</text><rect x="32" y="116" width="176" height="140" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="222" y="116" width="176" height="140" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="412" y="116" width="176" height="140" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="602" y="116" width="176" height="140" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="792" y="116" width="176" height="140" rx="15" fill="url(#card)" stroke="#29334d"/><path d="M120 157H880" stroke="#364464" stroke-width="2"/><path d="M120 157H880" stroke="url(#spectrum)" stroke-width="3" class="trace"/><circle cx="120" cy="157" r="26" fill="#111a2c" stroke="#60e7f9" stroke-opacity=".75"/><circle cx="120" cy="157" r="32" fill="none" stroke="#60e7f9" stroke-opacity=".2" stroke-dasharray="2 8"/><text x="120" y="163" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.5" fill="#60e7f9" text-anchor="middle">01</text><text x="120" y="212" font-family="Space Grotesk" font-size="20" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="middle">Scope</text><text x="120" y="238" font-family="Space Grotesk" font-size="12.7" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="middle">Define boundaries</text><circle cx="310" cy="157" r="26" fill="#111a2c" stroke="#a78bfa" stroke-opacity=".75"/><circle cx="310" cy="157" r="32" fill="none" stroke="#a78bfa" stroke-opacity=".2" stroke-dasharray="2 8"/><text x="310" y="163" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.5" fill="#a78bfa" text-anchor="middle">02</text><text x="310" y="212" font-family="Space Grotesk" font-size="20" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="middle">Map</text><text x="310" y="238" font-family="Space Grotesk" font-size="12.7" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="middle">Discover the surface</text><circle cx="500" cy="157" r="26" fill="#111a2c" stroke="#ff73b9" stroke-opacity=".75"/><circle cx="500" cy="157" r="32" fill="none" stroke="#ff73b9" stroke-opacity=".2" stroke-dasharray="2 8"/><text x="500" y="163" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.5" fill="#ff73b9" text-anchor="middle">03</text><text x="500" y="212" font-family="Space Grotesk" font-size="20" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="middle">Test</text><text x="500" y="238" font-family="Space Grotesk" font-size="12.7" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="middle">Validate weaknesses</text><circle cx="690" cy="157" r="26" fill="#111a2c" stroke="#7ef5bd" stroke-opacity=".75"/><circle cx="690" cy="157" r="32" fill="none" stroke="#7ef5bd" stroke-opacity=".2" stroke-dasharray="2 8"/><text x="690" y="163" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.5" fill="#7ef5bd" text-anchor="middle">04</text><text x="690" y="212" font-family="Space Grotesk" font-size="20" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="middle">Chain</text><text x="690" y="238" font-family="Space Grotesk" font-size="12.7" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="middle">Connect the findings</text><circle cx="880" cy="157" r="26" fill="#111a2c" stroke="#60e7f9" stroke-opacity=".75"/><circle cx="880" cy="157" r="32" fill="none" stroke="#60e7f9" stroke-opacity=".2" stroke-dasharray="2 8"/><text x="880" y="163" font-family="JetBrains Mono" font-size="16" font-weight="500" letter-spacing="0.5" fill="#60e7f9" text-anchor="middle">05</text><text x="880" y="212" font-family="Space Grotesk" font-size="20" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="middle">Report</text><text x="880" y="238" font-family="Space Grotesk" font-size="12.7" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="middle">Make the fix actionable</text></svg>
