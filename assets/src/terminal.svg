<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" role="img" aria-labelledby="title desc">
<title id="title">Security lab · Workflow preview</title><desc id="desc">An animated, illustrative security assessment: confirm scope, map assets, inspect access, validate impact, and prepare a report. This is a workflow illustration, not live scan results.</desc>
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60e7f9" stop-opacity=".65"/><stop offset=".43" stop-color="#a78bfa" stop-opacity=".12"/><stop offset="1" stop-color="#ff73b9" stop-opacity=".45"/></linearGradient>
 <linearGradient id="energy" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0"><stop stop-color="#60e7f9" stop-opacity="0"/><stop offset=".45" stop-color="#60e7f9"/><stop offset=".72" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9" stop-opacity="0"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#6f44b8" stop-opacity=".28"/><stop offset="1" stop-color="#6f44b8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8da5d5" stroke-width=".5" opacity=".08"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="998" height="390" rx="23"/></clipPath>
</defs>
<style>
@keyframes stage1 {0%,5%{opacity:0}10%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage2 {0%,19%{opacity:0}24%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage3 {0%,33%{opacity:0}38%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage4 {0%,47%{opacity:0}52%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage5 {0%,61%{opacity:0}66%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes pulse {0%,100%{opacity:.4}50%{opacity:1}}
@keyframes cursor {0%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes energy {0%{transform:translateX(-280px)}100%{transform:translateX(1100px)}}
@keyframes trace {to{stroke-dashoffset:-36}}
@media (prefers-reduced-motion: no-preference) {
 .s1{animation:stage1 12s linear infinite}.s2{animation:stage2 12s linear infinite}.s3{animation:stage3 12s linear infinite}.s4{animation:stage4 12s linear infinite}.s5{animation:stage5 12s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:cursor 1.1s steps(1) infinite}.energy{animation:energy 7s linear infinite}.trace{animation:trace 4s linear infinite}
}
@media (prefers-reduced-motion: reduce) {.s1,.s2,.s3,.s4,.s5,.pulse,.cursor{opacity:1}.energy{opacity:.7}}

</style>
<rect x=".5" y=".5" width="999" height="391" rx="23.5" fill="#070b14" stroke="url(#edge)"/>
<g clip-path="url(#frame)"><ellipse cx="950" cy="130" rx="330" ry="280" fill="url(#ambient)"/><rect width="1000" height="392" fill="url(#grid)"/><path d="M0 51H1000" stroke="#25334e"/><rect x="1" y="1" width="998" height="50" fill="#10152a" opacity=".8"/><circle cx="25" cy="26" r="4.5" fill="#ff73b9" opacity=".8"/><circle cx="43" cy="26" r="4.5" fill="#a78bfa" opacity=".8"/><circle cx="61" cy="26" r="4.5" fill="#7ef5bd" opacity=".8"/><text x="82" y="31" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">halim@security-lab</text><rect x="811" y="15" width="164" height="24" rx="12" fill="#7ef5bd" opacity=".08"/><circle class="pulse" cx="827" cy="27" r="3" fill="#7ef5bd"/><text x="839" y="31" font-family="JetBrains Mono" font-size="10" font-weight="400" letter-spacing="0.25" fill="#7ef5bd" text-anchor="start">AUTHORIZED FLOW</text><text x="28" y="83" font-family="JetBrains Mono" font-size="10" font-weight="500" letter-spacing="1.4" fill="#a78bfa" text-anchor="start">WORKFLOW PREVIEW</text><text x="28" y="114" font-family="JetBrains Mono" font-size="17" font-weight="400" letter-spacing="0" fill="#eef5ff" text-anchor="start">$ assess --mode authorized</text><rect class="cursor" x="295" y="99" width="8" height="17" fill="#60e7f9"/><g class="s1"><path d="M28 141v26" stroke="#60e7f9" stroke-width="2"/><text x="43" y="153" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#60e7f9" text-anchor="start">01</text><text x="73" y="153" font-family="JetBrains Mono" font-size="14" font-weight="500" letter-spacing="0" fill="#60e7f9" text-anchor="start">scope.confirm()</text><text x="73" y="172" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Establish permission and boundaries</text></g><g class="s2"><path d="M28 185v26" stroke="#a78bfa" stroke-width="2"/><text x="43" y="197" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#a78bfa" text-anchor="start">02</text><text x="73" y="197" font-family="JetBrains Mono" font-size="14" font-weight="500" letter-spacing="0" fill="#a78bfa" text-anchor="start">surface.map()</text><text x="73" y="216" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Map assets, endpoints, and data flows</text></g><g class="s3"><path d="M28 229v26" stroke="#ff73b9" stroke-width="2"/><text x="43" y="241" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#ff73b9" text-anchor="start">03</text><text x="73" y="241" font-family="JetBrains Mono" font-size="14" font-weight="500" letter-spacing="0" fill="#ff73b9" text-anchor="start">access.inspect()</text><text x="73" y="260" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Inspect identity and access controls</text></g><g class="s4"><path d="M28 273v26" stroke="#7ef5bd" stroke-width="2"/><text x="43" y="285" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#7ef5bd" text-anchor="start">04</text><text x="73" y="285" font-family="JetBrains Mono" font-size="14" font-weight="500" letter-spacing="0" fill="#7ef5bd" text-anchor="start">impact.validate()</text><text x="73" y="304" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Validate impact with reproducible steps</text></g><g class="s5"><path d="M28 317v26" stroke="#60e7f9" stroke-width="2"/><text x="43" y="329" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#60e7f9" text-anchor="start">05</text><text x="73" y="329" font-family="JetBrains Mono" font-size="14" font-weight="500" letter-spacing="0" fill="#60e7f9" text-anchor="start">report.prepare()</text><text x="73" y="348" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Document evidence and remediation</text></g><rect x="679" y="76" width="292" height="288" rx="16" fill="#10152a" fill-opacity=".65" stroke="#25334e"/><text x="701" y="101" font-family="JetBrains Mono" font-size="10" font-weight="400" letter-spacing="1.1" fill="#8d9bb6" text-anchor="start">ASSESSMENT MODEL</text><path d="M702 116H948" stroke="#25334e"/><path class="trace" d="M740 164L825 223L909 164M825 223V302" fill="none" stroke="#60e7f9" stroke-opacity=".45" stroke-dasharray="4 8"/><circle cx="825" cy="223" r="41" stroke="#a78bfa" stroke-opacity=".12" fill="none"/><circle class="pulse" cx="825" cy="223" r="49" stroke="#a78bfa" stroke-opacity=".16" fill="none"/><path d="M825 193l23 8v20c0 17-23 30-23 30s-23-13-23-30v-20z" fill="#a78bfa" fill-opacity=".09" stroke="#a78bfa" stroke-width="1.5"/><path d="M815 222l7 7 13-16" fill="none" stroke="#7ef5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="740" cy="164" r="17" fill="#10152a" stroke="#60e7f9" stroke-opacity=".55"/><circle cx="909" cy="164" r="17" fill="#10152a" stroke="#ff73b9" stroke-opacity=".55"/><circle cx="825" cy="302" r="17" fill="#10152a" stroke="#7ef5bd" stroke-opacity=".55"/><path d="M734 164h12m-6-6v12" stroke="#60e7f9" stroke-width="1.5"/><path d="M903 160h12m-12 4h9m-9 4h12" stroke="#ff73b9" stroke-width="1.5"/><path d="M820 295h7l3 3v11h-10zm7 0v4h3m-7 3h4m-4 3h4" fill="none" stroke="#7ef5bd" stroke-linejoin="round"/><text x="740" y="139" font-family="JetBrains Mono" font-size="9" font-weight="400" letter-spacing="0.6" fill="#60e7f9" text-anchor="middle">SCOPE</text><text x="909" y="139" font-family="JetBrains Mono" font-size="9" font-weight="400" letter-spacing="0.6" fill="#ff73b9" text-anchor="middle">EVIDENCE</text><text x="825" y="336" font-family="JetBrains Mono" font-size="9" font-weight="400" letter-spacing="0.6" fill="#7ef5bd" text-anchor="middle">ACTIONABLE REPORT</text><path d="M0 390H1000" stroke="#25334e" stroke-width="2"/><path class="energy" d="M0 390h240" stroke="url(#energy)" stroke-width="2"/></g>
</svg>