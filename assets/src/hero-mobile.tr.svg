<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title desc">
<title id="title">Abdulhalim Altuntaş — Web Uygulama Sızma Testi Uzmanı</title><desc id="desc">Abdulhalim Altuntaş. Web uygulama güvenliği, manuel sızma testi ve güvenlik araştırmaları. Hareketli yörüngeler ve ışıklı kalkan grafiği.</desc>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset=".53" stop-color="#0b1020"/><stop offset="1" stop-color="#10152a"/></linearGradient>
    <radialGradient id="coreGlow"><stop stop-color="#22758c" stop-opacity=".36"/><stop offset=".48" stop-color="#403679" stop-opacity=".16"/><stop offset="1" stop-color="#263056" stop-opacity="0"/></radialGradient>
    <radialGradient id="coreFace"><stop stop-color="#142c3b"/><stop offset="1" stop-color="#0a1324"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60e7f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9"/></linearGradient>
    <linearGradient id="ellipse"><stop stop-color="#60e7f9" stop-opacity="0"/><stop offset=".24" stop-color="#60e7f9" stop-opacity=".75"/><stop offset=".55" stop-color="#a78bfa" stop-opacity=".14"/><stop offset="1" stop-color="#ff73b9" stop-opacity=".8"/></linearGradient>
    <linearGradient id="ellipse2"><stop stop-color="#7ef5bd" stop-opacity=".7"/><stop offset=".5" stop-color="#60e7f9" stop-opacity=".08"/><stop offset="1" stop-color="#60e7f9" stop-opacity=".6"/></linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123344"/><stop offset="1" stop-color="#111c34"/></linearGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#96faff"/><stop offset=".44" stop-color="#60e7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#f6faff"/><stop offset=".6" stop-color="#d7e7ff"/><stop offset="1" stop-color="#b3b4fc"/></linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="34" y1="0" x2="540" y2="0"><stop stop-color="#60e7f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#718cc6" stop-opacity=".45"/><stop offset=".48" stop-color="#252e4e"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".4"/></linearGradient>
    <filter id="aurora"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#667897" stroke-width=".5" opacity=".1"/></pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#aab9db" opacity=".12"/></pattern>
    <clipPath id="bounds"><rect x=".5" y=".5" width="559" height="639" rx="24"/></clipPath>
    </defs>
<style>
  .aurora-a { animation: aurora-drift 15s ease-in-out infinite alternate; transform-origin: 65% 55%; }
  .aurora-b { animation: aurora-drift 20s ease-in-out infinite alternate-reverse; transform-origin: 80% 35%; }
  .core-orbit { animation: orbit-turn 28s linear infinite; }
  .core-orbit-slow { animation: orbit-turn 100s linear infinite; }
  .core-counter { animation: orbit-turn 42s linear infinite reverse; }
  .comet { animation: comet-run 11s linear infinite; }
  .shield-float { animation: shield-hover 6s ease-in-out infinite; }
  .shield-scan { animation: shield-sweep 5s ease-in-out infinite; }
  .star-pulse { animation: star-glow 4s ease-in-out infinite; }
  .signal { animation: signal-travel 9s linear infinite; }
  .cursor { animation: cursor-blink 1.6s step-end infinite; }
  @keyframes orbit-turn { to { transform: rotate(360deg); } }
  @keyframes comet-run { to { stroke-dashoffset: -864; } }
  @keyframes shield-hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes shield-sweep { 0%,100% { transform: translateY(-29px); opacity:.15; } 50% { transform: translateY(22px); opacity:.75; } }
  @keyframes star-glow { 0%,100% { opacity:.4; } 50% { opacity:1; } }
  @keyframes aurora-drift { from { transform: translate(-15px,10px) scale(.94); opacity:.65; } to { transform: translate(20px,-14px) scale(1.09); opacity:1; } }
  @keyframes signal-travel { to { stroke-dashoffset: -600; } }
  @keyframes cursor-blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .aurora-a,.aurora-b,.core-orbit,.core-orbit-slow,.core-counter,.comet,.shield-float,.shield-scan,.star-pulse,.signal,.cursor { animation:none !important; } }
</style>
