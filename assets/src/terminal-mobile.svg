<svg xmlns="http://www.w3.org/2000/svg" width="560" height="544" viewBox="0 0 560 544" role="img" aria-labelledby="title desc">
<title id="title">Security lab · Workflow preview</title><desc id="desc">An animated, illustrative security assessment: confirm scope, map assets, inspect access, validate impact, and prepare a report. This is a workflow illustration, not live scan results.</desc>
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60e7f9" stop-opacity=".65"/><stop offset=".43" stop-color="#a78bfa" stop-opacity=".12"/><stop offset="1" stop-color="#ff73b9" stop-opacity=".45"/></linearGradient>
 <linearGradient id="energy" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0"><stop stop-color="#60e7f9" stop-opacity="0"/><stop offset=".45" stop-color="#60e7f9"/><stop offset=".72" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9" stop-opacity="0"/></linearGradient>
 <linearGradient id="divider-energy" gradientUnits="userSpaceOnUse" x1="28" y1="477" x2="532" y2="477"><stop stop-color="#60e7f9" stop-opacity="0"/><stop offset=".45" stop-color="#60e7f9"/><stop offset=".72" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9" stop-opacity="0"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#6f44b8" stop-opacity=".28"/><stop offset="1" stop-color="#6f44b8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8da5d5" stroke-width=".5" opacity=".08"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="558" height="542" rx="23"/></clipPath>
</defs>
<style>
@keyframes stage1 {0%,5%{opacity:0}10%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage2 {0%,19%{opacity:0}24%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage3 {0%,33%{opacity:0}38%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage4 {0%,47%{opacity:0}52%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes stage5 {0%,61%{opacity:0}66%,90%{opacity:1}98%,100%{opacity:0}}
@keyframes pulse {0%,100%{opacity:.4}50%{opacity:1}}
@keyframes cursor {0%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes energy {0%{transform:translateX(-280px)}100%{transform:translateX(660px)}}
@keyframes trace {to{stroke-dashoffset:-36}}
@media (prefers-reduced-motion: no-preference) {
 .s1{animation:stage1 12s linear infinite}.s2{animation:stage2 12s linear infinite}.s3{animation:stage3 12s linear infinite}.s4{animation:stage4 12s linear infinite}.s5{animation:stage5 12s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:cursor 1.1s steps(1) infinite}.energy{animation:energy 7s linear infinite}.trace{animation:trace 4s linear infinite}
}
@media (prefers-reduced-motion: reduce) {.s1,.s2,.s3,.s4,.s5,.pulse,.cursor{opacity:1}.energy{opacity:.7}}

</style>
<rect x=".5" y=".5" width="559" height="543" rx="23.5" fill="#070b14" stroke="url(#edge)"/>
<g clip-path="url(#frame)"><ellipse cx="510" cy="130" rx="330" ry="280" fill="url(#ambient)"/><rect width="560" height="544" fill="url(#grid)"/><path d="M0 51H1000" stroke="#25334e"/><rect x="1" y="1" width="998" height="50" fill="#10152a" opacity=".8"/><circle cx="25" cy="26" r="4.5" fill="#ff73b9" opacity=".8"/><circle cx="43" cy="26" r="4.5" fill="#a78bfa" opacity=".8"/><circle cx="61" cy="26" r="4.5" fill="#7ef5bd" opacity=".8"/><text x="82" y="31" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">halim@security-lab</text><text x="28" y="83" font-family="JetBrains Mono" font-size="10" font-weight="500" letter-spacing="1.4" fill="#a78bfa" text-anchor="start">WORKFLOW PREVIEW</text><text x="28" y="114" font-family="JetBrains Mono" font-size="15" font-weight="400" letter-spacing="0" fill="#eef5ff" text-anchor="start">$ assess --mode authorized</text><rect class="cursor" x="264" y="101" width="8" height="17" fill="#60e7f9"/><g class="s1"><path d="M28 146v26" stroke="#60e7f9" stroke-width="2"/><text x="43" y="158" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#60e7f9" text-anchor="start">01</text><text x="73" y="158" font-family="JetBrains Mono" font-size="15" font-weight="500" letter-spacing="0" fill="#60e7f9" text-anchor="start">scope.confirm()</text><text x="73" y="177" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Establish permission and boundaries</text></g><g class="s2"><path d="M28 207v26" stroke="#a78bfa" stroke-width="2"/><text x="43" y="219" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#a78bfa" text-anchor="start">02</text><text x="73" y="219" font-family="JetBrains Mono" font-size="15" font-weight="500" letter-spacing="0" fill="#a78bfa" text-anchor="start">surface.map()</text><text x="73" y="238" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Map assets, endpoints, and data flows</text></g><g class="s3"><path d="M28 268v26" stroke="#ff73b9" stroke-width="2"/><text x="43" y="280" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#ff73b9" text-anchor="start">03</text><text x="73" y="280" font-family="JetBrains Mono" font-size="15" font-weight="500" letter-spacing="0" fill="#ff73b9" text-anchor="start">access.inspect()</text><text x="73" y="299" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Inspect identity and access controls</text></g><g class="s4"><path d="M28 329v26" stroke="#7ef5bd" stroke-width="2"/><text x="43" y="341" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#7ef5bd" text-anchor="start">04</text><text x="73" y="341" font-family="JetBrains Mono" font-size="15" font-weight="500" letter-spacing="0" fill="#7ef5bd" text-anchor="start">impact.validate()</text><text x="73" y="360" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Validate impact with reproducible steps</text></g><g class="s5"><path d="M28 390v26" stroke="#60e7f9" stroke-width="2"/><text x="43" y="402" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0" fill="#60e7f9" text-anchor="start">05</text><text x="73" y="402" font-family="JetBrains Mono" font-size="15" font-weight="500" letter-spacing="0" fill="#60e7f9" text-anchor="start">report.prepare()</text><text x="73" y="421" font-family="JetBrains Mono" font-size="12" font-weight="400" letter-spacing="0" fill="#8d9bb6" text-anchor="start">Document evidence and remediation</text></g><path d="M28 477H532" stroke="#25334e"/><circle class="pulse" cx="35" cy="506" r="4" fill="#7ef5bd"/><text x="49" y="510" font-family="JetBrains Mono" font-size="11" font-weight="400" letter-spacing="0.15" fill="#7ef5bd" text-anchor="start">SCOPE → EVIDENCE → REMEDIATION</text><path d="M28 477h504" stroke="url(#divider-energy)" stroke-width="1.5" opacity=".6"/><path d="M0 542H560" stroke="#25334e" stroke-width="2"/><path class="energy" d="M0 542h240" stroke="url(#energy)" stroke-width="2"/></g>
</svg>