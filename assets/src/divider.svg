<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="32" viewBox="0 0 1000 32" aria-hidden="true"><defs><linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="1000" y2="16"><stop stop-color="#60e7f9" stop-opacity="0"/><stop offset=".25" stop-color="#60e7f9"/><stop offset=".65" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9" stop-opacity="0"/></linearGradient></defs><style>.beam{stroke-dasharray:80 1000;animation:pass 6s ease-in-out infinite;}@keyframes pass{from{stroke-dashoffset:90}to{stroke-dashoffset:-1000}}@media(prefers-reduced-motion:reduce){.beam{animation:none}}</style><path d="M0 16H1000" stroke="url(#line)" stroke-opacity=".24"/><path class="beam" d="M0 16H1000" stroke="url(#line)" stroke-width="2"/></svg>