<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
<title id="title">Sistematik yaklaşım</title><desc id="desc">Kapsamı belirle, saldırı yüzeyini haritala, zafiyetleri doğrula, bulguları ilişkilendir, çözümleri raporla.</desc>
<defs>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152a"/><stop offset="1" stop-color="#070b14"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141c32"/><stop offset="1" stop-color="#0c1222"/></linearGradient>
<linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="32" y1="1" x2="528" y2="1"><stop stop-color="#60e7f9"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5941b8" stop-opacity=".28"/><stop offset="1" stop-color="#5941b8" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7386bd" stroke-opacity=".045"/></pattern>
<linearGradient id="flowSpectrum" gradientUnits="userSpaceOnUse" x1="75" y1="148" x2="75" y2="588"><stop stop-color="#60e7f9"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff73b9"/></linearGradient>
</defs>
<style>
.trace {stroke-dasharray:28 580; animation:travel 11s linear infinite;}
.trace-alt {stroke-dasharray:18 510; animation:travel 15s linear infinite reverse;}
.breathe {animation:breathe 5s ease-in-out infinite;}
@keyframes travel {to {stroke-dashoffset:-1216;}}
@keyframes breathe {0%,100% {opacity:.30;} 50% {opacity:.65;}}
@media (prefers-reduced-motion: reduce) { .trace,.trace-alt,.breathe {animation:none;} }
</style>
<rect x="1" y="1" width="558" height="698" rx="24" fill="url(#panel)" stroke="#26304a"/>
<rect x="2" y="2" width="556" height="696" rx="23" fill="url(#grid)"/>
<ellipse cx="464.79999999999995" cy="55" rx="196.0" ry="230" fill="url(#halo)"/>
<path d="M32 1H528" stroke="url(#spectrum)" stroke-width="2" opacity=".8"/>
<text x="32" y="46" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="1.2" fill="#9faccc" text-anchor="start">ÇALIŞMA YÖNTEMİ</text><text x="32" y="89" font-family="Space Grotesk" font-size="32" font-weight="600" letter-spacing="0" fill="#eff4ff" text-anchor="start">Sistematik yaklaşım</text><rect x="28" y="113" width="504" height="97" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="28" y="224" width="504" height="97" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="28" y="335" width="504" height="97" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="28" y="446" width="504" height="97" rx="15" fill="url(#card)" stroke="#29334d"/><rect x="28" y="557" width="504" height="97" rx="15" fill="url(#card)" stroke="#29334d"/><path d="M75 148V588" stroke="#364464" stroke-width="2"/><path d="M75 148V588" stroke="url(#flowSpectrum)" stroke-width="3" stroke-dasharray="24 122" class="trace"/><circle cx="75" cy="155" r="29" fill="#101827" stroke="#60e7f9" stroke-opacity=".55"/><circle cx="75" cy="155" r="35" fill="none" stroke="#60e7f9" stroke-opacity=".18" stroke-dasharray="3 8"/><text x="75" y="163" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="0" fill="#60e7f9" text-anchor="middle">01</text><text x="124" y="153" font-family="Space Grotesk" font-size="28" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="start">Kapsam</text><text x="124" y="188" font-family="Space Grotesk" font-size="24" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="start">Sınırları belirle</text><circle cx="75" cy="266" r="29" fill="#101827" stroke="#a78bfa" stroke-opacity=".55"/><circle cx="75" cy="266" r="35" fill="none" stroke="#a78bfa" stroke-opacity=".18" stroke-dasharray="3 8"/><text x="75" y="274" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="0" fill="#a78bfa" text-anchor="middle">02</text><text x="124" y="264" font-family="Space Grotesk" font-size="28" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="start">Haritalama</text><text x="124" y="299" font-family="Space Grotesk" font-size="24" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="start">Saldırı yüzeyini keşfet</text><circle cx="75" cy="377" r="29" fill="#101827" stroke="#ff73b9" stroke-opacity=".55"/><circle cx="75" cy="377" r="35" fill="none" stroke="#ff73b9" stroke-opacity=".18" stroke-dasharray="3 8"/><text x="75" y="385" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="0" fill="#ff73b9" text-anchor="middle">03</text><text x="124" y="375" font-family="Space Grotesk" font-size="28" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="start">Test</text><text x="124" y="410" font-family="Space Grotesk" font-size="24" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="start">Zafiyetleri doğrula</text><circle cx="75" cy="488" r="29" fill="#101827" stroke="#7ef5bd" stroke-opacity=".55"/><circle cx="75" cy="488" r="35" fill="none" stroke="#7ef5bd" stroke-opacity=".18" stroke-dasharray="3 8"/><text x="75" y="496" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="0" fill="#7ef5bd" text-anchor="middle">04</text><text x="124" y="486" font-family="Space Grotesk" font-size="28" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="start">İlişkilendirme</text><text x="124" y="521" font-family="Space Grotesk" font-size="24" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="start">Bulguları ilişkilendir</text><circle cx="75" cy="599" r="29" fill="#101827" stroke="#60e7f9" stroke-opacity=".55"/><circle cx="75" cy="599" r="35" fill="none" stroke="#60e7f9" stroke-opacity=".18" stroke-dasharray="3 8"/><text x="75" y="607" font-family="JetBrains Mono" font-size="24" font-weight="500" letter-spacing="0" fill="#60e7f9" text-anchor="middle">05</text><text x="124" y="597" font-family="Space Grotesk" font-size="28" font-weight="600" letter-spacing="0" fill="#f2f5ff" text-anchor="start">Raporlama</text><text x="124" y="632" font-family="Space Grotesk" font-size="24" font-weight="400" letter-spacing="0" fill="#a8b8d5" text-anchor="start">Uygulanabilir çözüm sun</text></svg>
